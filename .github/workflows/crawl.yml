name: 爬取什么值得买内容

on:
  schedule:
    # 每小时第55分钟运行，避开GitHub整点调度高峰
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: smzdm-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 缓存Playwright浏览器
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    - name: 安装Playwright浏览器
      run: |
        python -m playwright install --with-deps chromium

    - name: 生成每日精选和RSS
      run: |
        python scripts/build_digest.py \
          --output docs/daily_digest.md \
          --json-output docs/daily_digest.json \
          --public-url https://doane2002cn.github.io/smzdm-wenzhang-rss

    - name: 提交并推送更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add \
          docs/daily_digest.md \
          docs/daily_digest.json \
          docs/daily_digest.xml \
          docs/community_daily_rank.md \
          docs/community_daily_rank.json \
          state/garbage_selection_state.json
        if git diff --staged --quiet; then
          echo "内容没有变化，跳过提交"
        else
          git commit -m "自动更新爬取内容 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
